<!DOCTYPE html>
<html>
    <head>
        <title>Minecraft</title>
        <style>
            body{
                margin: 0;
                overflow: hidden;
                background: skyblue;
            }
            canvas{
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <script>
            const canvas =canvas
            document.getElementById("game");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const gridSize = 40;
            let blocks = [];

            //draw grid blocks
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let b of blocks) {
                    ctx.fillstyle = b.color;
                    ctx.fillRect(b.x,b.y,gridSize,gridSize);
                    ctx.strokeRect(b.x, b.y, gridSize, gridSize);
                    
                }
            }

            //add blocks on click
            canvas.addEventListener("click",(e)=>{
                const x = Math.floor(e.clientX/gridSize)*gridSize;
                const y = Math.floor(e.clientY/gridSize)*gridSize;

                blocks.push({
                    x:x,
                    y:y,
                    color:"brown"     
             });

             draw();
            });

            //simple ground
            for(let i = 0; i<canvas.width;i+=gridSize){
                blocks.push({x: i,y: canvas.height-gridSize,color:"green"});
            }

            draw();
        </script>

    </body>
</html>
